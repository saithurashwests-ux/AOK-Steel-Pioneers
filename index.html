<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOK Steel Pioneers LMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>AOK Steel Pioneers LMS</h1>
            <p>Steel Engineering Learning Management System</p>
        </header>

        <section id="auth-section">
            <div id="logged-out-view">
                <button id="google-login-btn" class="btn">Sign in with Google</button>
            </div>
            <div id="logged-in-view" style="display: none;">
                <p>Welcome, <span id="user-name"></span>!</p>
                <button id="logout-btn" class="btn-danger">Sign Out</button>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
